<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shift Maze</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1608;--gold1:#ffe27a;--gold2:#ffb02e;--gold3:#d7780f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:14px;font-family:'Nunito','Trebuchet MS',system-ui,sans-serif;font-weight:700;color:#fff;overflow-x:hidden;
background:radial-gradient(ellipse at 50% -10%,#7ff0d8 0%,#35a6c9 30%,#2559b5 62%,#2a2670 100%)}
body::before,body::after{content:"";position:fixed;width:300px;height:220px;background:linear-gradient(135deg,#8be34a,#1f7a3a);border-radius:0 100% 0 100%;z-index:0;box-shadow:inset -8px -8px 0 rgba(0,0,0,.18)}
body::before{left:-90px;top:-60px;transform:rotate(-12deg)}body::after{right:-90px;bottom:-60px;transform:rotate(168deg)}
main{width:min(94vw,500px);position:relative;z-index:1}
.logo{text-align:center;margin:0 0 10px;transform:rotate(-2deg)}
.logo b{display:inline-block;font:400 2.5rem 'Lilita One',sans-serif;letter-spacing:2px;color:var(--gold1);background:linear-gradient(#66cf45,#2b8a2a);border:4px solid var(--gold2);border-radius:16px;padding:0 22px;box-shadow:0 5px 0 #6b3a0f,inset 0 3px 0 rgba(255,255,255,.4);text-shadow:0 3px 0 #b8650c,0 5px 0 #6b3a0f,-2px -2px 0 #6b3a0f,2px -2px 0 #6b3a0f}
.logo small{display:block;width:56%;margin:-4px auto 0;font:400 1.4rem 'Lilita One',sans-serif;letter-spacing:3px;color:#ffe9a8;background:linear-gradient(#a8662d,#6e3a14);border:3px solid var(--gold2);border-top:0;border-radius:0 0 14px 14px;text-shadow:0 2px 0 #3a1d08;box-shadow:0 4px 0 #3a1d08}
.cap{margin:0 0 10px;font-size:.95rem;min-height:2.6em;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr 1.7fr;gap:8px;margin-bottom:12px}
.hud>div{background:rgba(8,28,70,.55);border:3px solid rgba(255,255,255,.4);border-radius:16px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 rgba(0,0,0,.3);padding:5px 9px;font-size:.68rem;color:#aeeaff;text-transform:uppercase;letter-spacing:1px}
.hud b{display:block;font:400 1.4rem 'Lilita One',sans-serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5);letter-spacing:0}
.pips{display:flex;gap:6px;margin:4px 0}.pips i{flex:1;height:16px;border-radius:50%;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.4)}
.pips i.on{background:radial-gradient(circle at 35% 30%,#fff7c2,#ffb02e 55%,#d7780f);border-color:#8a4b05;box-shadow:0 0 8px #ffd54a}
#phase{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.62rem;letter-spacing:1px}
#board{display:grid;padding:8px;border:6px solid #5aa9ff;border-radius:22px;background:linear-gradient(#a8662d,#6e3a14);width:100%;transition:border-color .25s,box-shadow .25s;box-shadow:0 7px 0 #3a1d08,0 0 22px rgba(90,169,255,.8),0 14px 26px rgba(0,0,0,.4)}
#board.B{border-color:#ffc83a;box-shadow:0 7px 0 #3a1d08,0 0 22px rgba(255,200,58,.85),0 14px 26px rgba(0,0,0,.4)}
#board.flip{animation:fl .3s}@keyframes fl{40%{transform:rotateX(14deg) scale(1.04)}}
.c{aspect-ratio:1;position:relative;background:#f1d9a0;box-shadow:inset 0 0 0 1px rgba(150,100,30,.2)}
.c:nth-child(odd){background:#ecd195}
.k{background:linear-gradient(#9a97ad,#5d5a73);border-radius:7px;box-shadow:inset 0 3px 0 #c4c1d4,inset 0 -4px 0 #3e3b52,0 6px 0 #3e3b52,0 10px 10px rgba(0,0,0,.35);z-index:1}
.k::before{content:"";position:absolute;left:0;right:0;top:0;height:30%;background:linear-gradient(#8be34a,#3fa535);border-radius:7px 7px 12px 12px}
.a,.b{border-radius:9px;z-index:1;transition:all .2s}
.a{background:rgba(90,170,255,.16);outline:3px dashed rgba(130,205,255,.95);outline-offset:-5px}
.b{background:rgba(255,176,46,.18);outline:3px dashed rgba(255,150,30,.95);outline-offset:-5px}
.a.on{background:linear-gradient(#9ff5ff,#3a8cff 55%,#2342c9);outline:none;box-shadow:inset 0 3px 0 #d9fcff,inset 0 -4px 0 #1b2f94,0 6px 0 #1b2f94,0 0 12px rgba(80,180,255,.9)}
.b.on{background:linear-gradient(var(--gold1),var(--gold2) 55%,var(--gold3));outline:none;box-shadow:inset 0 3px 0 #fff3b8,inset 0 -4px 0 #9a5208,0 6px 0 #9a5208,0 0 12px rgba(255,190,50,.9)}
.a.on::after,.b.on::after{content:"";position:absolute;left:14%;top:12%;width:42%;height:22%;border-radius:50%;background:rgba(255,255,255,.6);transform:rotate(-20deg)}
.soon .c.a:not(.on),.soon .c.b:not(.on){animation:pu .45s infinite alternate}@keyframes pu{to{background-color:rgba(255,255,255,.55)}}
.e::before{content:"";position:absolute;inset:4%;z-index:2;background:var(--chest) center/100% 100% no-repeat;animation:gl .9s ease-in-out infinite alternate}
@keyframes gl{to{transform:translateY(-3px) scale(1.05)}}
.p::after{content:"";position:absolute;inset:-6%;z-index:3;background:var(--cat) center/100% 100% no-repeat;animation:hop .2s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
@keyframes hop{50%{transform:translateY(-6px) scale(1.08)}}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
button{font:400 1rem 'Lilita One',sans-serif;letter-spacing:.5px;color:#fff;background:linear-gradient(#9cec55,#3da83a);border:3px solid #1d5a1f;border-bottom-width:6px;border-radius:14px;padding:5px 14px;text-shadow:0 2px 0 #1d5a1f;box-shadow:inset 0 3px 0 rgba(255,255,255,.55);cursor:pointer}
button:active{transform:translateY(3px);border-bottom-width:3px}button:focus-visible{outline:3px solid #fff;outline-offset:2px}
button.ghost{background:linear-gradient(#8fb4ff,#3c5bd0);border-color:#1b2f94;text-shadow:0 2px 0 #1b2f94}
.hint{font-size:.78rem;margin:10px 4px 0;text-align:center;color:#d8f3ff;text-shadow:0 1px 0 rgba(0,0,0,.5)}
#ov{position:absolute;inset:-10px;display:none;flex-direction:column;justify-content:center;gap:12px;padding:22px;z-index:5;color:#4a2608;background:linear-gradient(#fff6d6,#f3d99a);border:6px solid #8a4b05;border-radius:26px;box-shadow:inset 0 0 0 4px #ffd54a,0 8px 0 #3a1d08,0 18px 40px rgba(0,0,0,.55)}
#ov.on{display:flex}#ov h2{font:400 2rem 'Lilita One',sans-serif;margin:0;color:var(--gold1);text-shadow:0 3px 0 #b8650c,0 5px 0 #6b3a0f,-2px -2px 0 #6b3a0f,2px -2px 0 #6b3a0f;letter-spacing:1px}#ov p{margin:0;line-height:1.4}
.top{display:flex;align-items:center;gap:12px}.mascot{width:84px;height:84px;flex:none;background:var(--cat) center/100% 100% no-repeat;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid button{display:flex;flex-direction:column;align-items:center;font-size:1.3rem;padding:6px}
.grid button:disabled{background:linear-gradient(#cfc8b4,#9a9380);border-color:#5d5848;text-shadow:none;color:#6b6554;cursor:not-allowed}.grid span{font:700 .6rem Nunito,sans-serif;letter-spacing:1px;text-shadow:none}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:12px;padding:8px 10px;background:rgba(8,28,70,.55);border:3px solid rgba(255,255,255,.35);border-radius:16px;font-size:.78rem}
.leg span{display:flex;align-items:center;gap:6px}.leg .c{width:24px;flex:none;border-radius:6px}
.how{display:flex;flex-direction:column;gap:10px}.how .row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.55);border:3px solid #c98430;border-radius:14px;padding:6px 10px;line-height:1.3;font-size:.9rem}
.how .pic{display:flex;gap:6px;align-items:center;flex:none;min-width:98px}.how .c{width:44px;flex:none;border-radius:8px}.how .arrow{font:400 1.4rem 'Lilita One',sans-serif;color:#8a4b05}
.how .gem{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c2,#ffb02e 55%,#d7780f);border:2px solid #8a4b05;box-shadow:0 0 8px #ffd54a}
main{perspective:1100px}
#board{transform:rotateX(14deg);transform-origin:50% 100%}
@keyframes bump{25%{transform:rotateX(14deg) translateX(-6px)}75%{transform:rotateX(14deg) translateX(6px)}}
#board.bump{animation:bump .25s}
.pop{animation:pop .35s}@keyframes pop{0%{transform:translateY(10px) scale(.6);opacity:.4}60%{transform:translateY(-5px) scale(1.12)}100%{transform:none;opacity:1}}
.fx,.cf{position:fixed;pointer-events:none;z-index:50}
.fx{width:9px;height:9px;margin:-4px;animation:fx .7s ease-out forwards}@keyframes fx{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.cf{width:10px;height:14px;top:-20px;animation:cf 2s ease-in forwards}@keyframes cf{to{transform:translate(var(--dx),115vh) rotate(720deg)}}
#pulse{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;background:radial-gradient(circle at 50% 50%,transparent 40%,var(--pc,rgba(90,169,255,.6)) 100%)}
#pulse.go{animation:pl .55s}@keyframes pl{30%{opacity:1}100%{opacity:0}}
.ff{position:fixed;width:6px;height:6px;border-radius:50%;background:#fff7a8;box-shadow:0 0 10px 4px rgba(255,235,120,.8);z-index:0;animation:ff 6s ease-in-out infinite alternate}@keyframes ff{to{transform:translate(var(--fx),var(--fy));opacity:.15}}
#ov.bp{color:#e8f6ff;background-color:#0d3b8c;background-image:linear-gradient(rgba(255,255,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:96px 96px,96px 96px,24px 24px,24px 24px;border-color:#8fd3ff;box-shadow:inset 0 0 0 3px #0d3b8c,inset 0 0 0 5px #8fd3ff,0 8px 0 #06214f,0 18px 40px rgba(0,0,0,.55)}
#ov.bp h2{color:#fff;text-shadow:0 0 12px #5ac8ff,0 3px 0 #06214f}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.step{border:2px dashed #8fd3ff;border-radius:12px;padding:12px 4px 8px;text-align:center;background:rgba(6,33,79,.5);position:relative}
.step .n{position:absolute;left:-7px;top:-11px;background:#8fd3ff;color:#06214f;font:400 .9rem 'Lilita One',sans-serif;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.stage{height:88px;display:flex;align-items:center;justify-content:center;gap:4px;transform:perspective(260px) rotateX(36deg)}
.stage .c{width:34px;flex:none;border-radius:6px;animation:bob 1.4s ease-in-out infinite alternate}.stage .c:nth-child(2){animation-delay:.3s}@keyframes bob{to{transform:translateY(-6px)}}
.step b{display:block;font:400 1.3rem 'Lilita One',sans-serif;letter-spacing:1px;margin-top:4px;color:#fff;text-shadow:0 0 8px #5ac8ff}
.step small{display:block;font-size:.68rem;opacity:.85;text-transform:uppercase;letter-spacing:1px}
.key{font:400 .85rem 'Lilita One',sans-serif;background:#fff;color:#06214f;padding:6px 10px;border-radius:8px;box-shadow:0 5px 0 #8fd3ff,0 8px 0 #06214f}
.gems{display:flex;align-items:center;gap:8px;justify-content:center;border:2px dashed #8fd3ff;border-radius:12px;padding:6px;background:rgba(6,33,79,.5)}.gems .gem{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c2,#ffb02e 55%,#d7780f);border:2px solid #8a4b05;box-shadow:0 0 8px #ffd54a}
@media (prefers-reduced-motion:reduce){.ff,.fx,.cf{display:none}*{animation-duration:.01s!important}}
</style></head><body><main>
<div class="logo"><b>SHIFT</b><small>MAZE</small></div><p class="cap" id="cap"></p>
<div class="hud"><div>Level<b id="lv"></b></div><div>Moves<b id="mv"></b></div><div>Par<b id="par"></b></div>
<div>Shift in<div class="pips" id="pips"><i></i><i></i><i></i></div><span id="phase"></span></div></div>
<div id="board" aria-label="Maze board"></div>
<div class="bar"><button data-k="ArrowUp" aria-label="Up">&#9650;</button><button data-k="ArrowLeft" aria-label="Left">&#9664;</button><button data-k="ArrowDown" aria-label="Down">&#9660;</button><button data-k="ArrowRight" aria-label="Right">&#9654;</button>
<button data-k=" ">Wait</button><button data-k="z">Undo</button><button data-k="r">Restart</button><button class="ghost" data-k="m">Menu</button><button class="ghost" id="mu">Music: off</button></div>
<div class="leg"><span><i class="c p"></i>You</span><span><i class="c e"></i>Goal</span><span><i class="c a on"></i>Wall now</span><span><i class="c a"></i>Next wall</span></div>
<p class="hint">Arrows or WASD move. Space waits. Z undo. R restart.</p>
<div id="ov"></div></main><div id="pulse"></div>
<script>
/*LEVELS*/
const LEVELS = [["#######", "#S.a.E#", "#.###.#", "#.....#", "#######"], ["#######", "#S.#..#", "#.#a#.#", "#.#.#E#", "#.....#", "#######"], ["#######", "#S....#", "#.##b.#", "###ba.#", "#.a..a#", "#.b.aE#", "#######"], ["#########", "#S.bb.ab#", "#..a.#.##", "#a#...#.#", "#.##..bb#", "#a.a#.a.#", "#.....a.#", "#ba.a.#E#", "#########"], ["#########", "#S..b.###", "#..ab.#.#", "###.....#", "#..#b##b#", "#a..##bb#", "#b.b#...#", "#.a.a#.E#", "#########"], ["#########", "#S.#..b##", "##.b.aa.#", "#.b.a#a.#", "#.a....b#", "####.a.a#", "#a.#..a##", "###aa#.E#", "#########"], ["###########", "#S.....#b.#", "#.#b.....b#", "##a..a.bb.#", "#......#..#", "#...#.ab.a#", "#...a.ab.a#", "#...#.#.bb#", "#a#.b#bb..#", "#....#...E#", "###########"], ["###########", "#S#.#a.b#.#", "#a.b..#...#", "##...b..a.#", "##.##...aa#", "##a#ba##.b#", "#a#.b..bba#", "#b.a#.#.#.#", "#....#.a..#", "##b.#aa#.E#", "###########"], ["###########", "#Sb..a.#b##", "##....#.#b#", "#..####b.##", "#....#.b.b#", "#....#.##.#", "#a.b.bb#..#", "#b...aba#.#", "#aa..aa.#a#", "#..##..#aE#", "###########"]];
/*END*/
// ---- art: cartoon SVGs drawn in code ----
const svgUrl=x=>`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>${x}</svg>`)}")`;
const CAT=svgUrl(`<ellipse cx='14' cy='28' rx='9' ry='14' fill='#6b4226' stroke='#3a2410' stroke-width='2' transform='rotate(22 14 28)'/><ellipse cx='50' cy='28' rx='9' ry='14' fill='#6b4226' stroke='#3a2410' stroke-width='2' transform='rotate(-22 50 28)'/><circle cx='32' cy='37' r='22' fill='#e9c595' stroke='#5a3a1e' stroke-width='2.5'/><ellipse cx='32' cy='47' rx='13' ry='9.5' fill='#6b4a2e'/><ellipse cx='32' cy='43' rx='5.5' ry='3.8' fill='#241410'/><path d='M26 50q6 6 12 0' fill='none' stroke='#e9c595' stroke-width='2' stroke-linecap='round'/><circle cx='23' cy='34' r='7.5' fill='#fff' stroke='#3a2410' stroke-width='1.5'/><circle cx='41' cy='34' r='7.5' fill='#fff' stroke='#3a2410' stroke-width='1.5'/><circle cx='24.5' cy='35' r='4.4' fill='#2b1a10'/><circle cx='39.5' cy='35' r='4.4' fill='#2b1a10'/><circle cx='26' cy='33' r='1.7' fill='#fff'/><circle cx='41' cy='33' r='1.7' fill='#fff'/><ellipse cx='32' cy='19' rx='23' ry='6' fill='#8a5a2b' stroke='#4a2c12' stroke-width='2'/><path d='M17 19Q19 4 32 4Q45 4 47 19Z' fill='#b07a3f' stroke='#4a2c12' stroke-width='2'/><rect x='18' y='13' width='28' height='5' fill='#3a2410'/>`);
const CHEST=svgUrl(`<rect x='8' y='28' width='48' height='26' rx='4' fill='#a8641f' stroke='#4a2608' stroke-width='3'/><path d='M8 30Q8 10 32 10Q56 10 56 30Z' fill='#c98430' stroke='#4a2608' stroke-width='3'/><rect x='14' y='12' width='6' height='42' fill='#ffd54a' stroke='#8a4b05' stroke-width='1.5'/><rect x='44' y='12' width='6' height='42' fill='#ffd54a' stroke='#8a4b05' stroke-width='1.5'/><rect x='26' y='25' width='12' height='15' rx='3' fill='#ffd54a' stroke='#8a4b05' stroke-width='2'/><circle cx='32' cy='31' r='2.4' fill='#3a1d08'/><rect x='31' y='32' width='2' height='5' fill='#3a1d08'/><path d='M54 4l2 5 5 2-5 2-2 5-2-5-5-2 5-2z' fill='#fff'/><path d='M8 8l1.5 3.5 3.5 1.5-3.5 1.5L8 18l-1.5-3.5L3 13l3.5-1.5z' fill='#fff'/>`);
document.documentElement.style.setProperty('--cat',CAT);document.documentElement.style.setProperty('--chest',CHEST);
const CAPS=["Reach the chest. Walls swap every 3 moves.","Gold walls appear after the shift.","Dashed blocks show the next swap."];
const SHIFT=3,$=id=>document.getElementById(id),open_=()=>$('ov').classList.contains('on');
const layoutAt=m=>Math.floor(m/SHIFT)%2;
const wallIn=(c,L)=>c==='#'||(c==='a'&&L===0)||(c==='b'&&L===1);
function parse(i){const rows=LEVELS[i];let s,e;
  const cells=rows.map((r,y)=>[...r].map((ch,x)=>{if(ch==='S'){s=[x,y];return'.'}if(ch==='E'){e=[x,y];return'.'}return ch}));
  return{cells,w:rows[0].length,h:rows.length,s,e}}
function solve(g){const seen=new Set(),q=[[g.s[0],g.s[1],0]];seen.add(g.s+',0');let i=0;
  while(i<q.length){const[x,y,m]=q[i++];if(x===g.e[0]&&y===g.e[1])return m;
    for(const[dx,dy]of[[0,0],[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,c=g.cells[ny]?.[nx];if(!c)continue;
      if(wallIn(c,layoutAt(m))||wallIn(c,layoutAt(m+1)))continue;const k=nx+','+ny+','+((m+1)%6);if(seen.has(k))continue;seen.add(k);q.push([nx,ny,m+1])}}
  return -1}
const PAR=LEVELS.map((_,i)=>solve(parse(i)));
let best={};try{best=JSON.parse(localStorage.getItem('shiftmaze')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('shiftmaze',JSON.stringify(best))}catch(e){}};
let li=0,g,st,hist;
function load(i){li=i;g=parse(i);st={x:g.s[0],y:g.s[1],m:0};hist=[];render(false);$('cap').textContent=CAPS[i]||'Plan around the shift.'}
function render(flip){
  const b=$('board'),L=layoutAt(st.m),left=SHIFT-(st.m%SHIFT);
  b.style.gridTemplateColumns=`repeat(${g.w},1fr)`;b.className=(L?'B':'A')+(left===1?' soon':'');
  let h='';for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){const ch=g.cells[y][x];let c='c';
    if(ch==='#')c+=' k';else if(ch==='a')c+=' a'+(L===0?' on':'');else if(ch==='b')c+=' b'+(L===1?' on':'');
    if(x===g.e[0]&&y===g.e[1])c+=' e';if(x===st.x&&y===st.y)c+=' p';h+=`<div class="${c}"></div>`}
  b.innerHTML=h;if(flip){b.classList.add('flip');b.querySelectorAll('.on').forEach(e=>e.classList.add('pop'))}
  $('lv').textContent=(li+1)+'/'+LEVELS.length;$('mv').textContent=st.m;$('par').textContent=PAR[li];
  [...$('pips').children].forEach((p,i)=>p.classList.toggle('on',i<left));
  const ph=$('phase');ph.textContent=L?'GOLD walls on':'BLUE walls on';ph.style.background=L?'var(--gold)':'var(--blue)';ph.style.color=L?'var(--ink)':'#fff'}
function move(dx,dy){if(open_())return;const nx=st.x+dx,ny=st.y+dy,m2=st.m+1,c=g.cells[ny]?.[nx];
  if(!c||wallIn(c,layoutAt(st.m))||wallIn(c,layoutAt(m2)))return(blip(110,.12),bump());
  hist.push({...st});st={x:nx,y:ny,m:m2};const sh=m2%SHIFT===0;blip(sh?560:330);render(sh);fxMove(sh);
  if(nx===g.e[0]&&ny===g.e[1])win()}
function undo(){if(hist.length&&!open_()){st=hist.pop();blip(220);render(false)}}
const head=(t,p)=>`<div class="top"><div class="mascot"></div><h2>${t}</h2></div><p>${p}</p>`;
function overlay(t,p,btns){const o=$('ov');o.classList.remove('bp');o.innerHTML=head(t,p)+'<div class="bar" id="ob"></div>';
  btns.forEach(([l,f,gh])=>{const b=document.createElement('button');b.textContent=l;if(gh)b.className='ghost';b.onclick=()=>{o.classList.remove('on');f()};$('ob').appendChild(b)});
  o.classList.add('on');$('ob').firstChild.focus()}
function win(){jingle();confetti();const m=st.m,p=PAR[li];if(!best[li]||m<best[li])best[li]=m;save();
  const msg=`Solved in ${m} moves. Par is ${p}. `+(m<=p?'Perfect, you matched the solver!':`The solver needs ${p}, can you?`);
  const last=li===LEVELS.length-1;
  overlay(last?'You escaped!':'Level clear',msg,[[last?'Level menu':'Next level',()=>last?menu():load(li+1)],['Retry',()=>load(li),1],['Menu',menu,1]])}
function howto(){const o=$('ov');o.classList.add('bp');
  o.innerHTML=`<div class="top"><div class="mascot"></div><h2>How to play</h2></div>
  <div class="steps">
   <div class="step"><span class="n">1</span><div class="stage"><i class="c p"></i><i class="c e"></i></div><b>GO</b><small>reach the chest</small></div>
   <div class="step"><span class="n">2</span><div class="stage"><i class="c a on"></i><i class="c b on"></i></div><b>SWAP</b><small>every 3 moves</small></div>
   <div class="step"><span class="n">3</span><div class="stage"><i class="c a"></i><span class="key">SPACE</span></div><b>WAIT</b><small>dashed = next wall</small></div>
  </div>
  <div class="gems"><i class="gem"></i><i class="gem"></i><i class="gem"></i><span>gems = moves until swap</span></div>
  <div class="bar" id="ob"></div>`;
  const b=document.createElement('button');b.textContent="Got it, play!";b.onclick=()=>{try{localStorage.setItem('shiftmaze_seen','1')}catch(e){}menu()};$('ob').appendChild(b);
  o.classList.add('on');b.focus()}
function menu(){const o=$('ov');o.classList.remove('bp');o.innerHTML=head('Shift Maze','A classic maze, but every 3 moves the walls swap places. Plan your path around the shift.')+'<div class="grid" id="gr"></div>';
  LEVELS.forEach((_,i)=>{const b=document.createElement('button'),ok=i===0||best[i-1];b.disabled=!ok;
    b.innerHTML=`${i+1}<span>${ok?(best[i]?(best[i]<=PAR[i]?'\u2605 PAR':best[i]+' MOVES'):'NEW'):'LOCKED'}</span>`;b.onclick=()=>{o.classList.remove('on');load(i)};o.querySelector('#gr').appendChild(b)});
  const hb=document.createElement('button');hb.className='ghost';hb.textContent='How to play';hb.onclick=howto;const w=document.createElement('div');w.className='bar';w.appendChild(hb);o.appendChild(w);
  o.classList.add('on')}
// ---- effects ----
function burst(x,y,n,cols){for(let i=0;i<n;i++){const e=document.createElement('i');e.className='fx';e.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%cols.length]};--dx:${(Math.random()-.5)*130}px;--dy:${-20-Math.random()*80}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),750)}}
function confetti(){const cols=['#ffd54a','#5aa9ff','#8be34a','#ff7a7a','#fff'];for(let i=0;i<70;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%5]};--dx:${(Math.random()-.5)*300}px;animation-delay:${Math.random()*.5}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),2700)}}
function pulse(){const p=$('pulse');p.style.setProperty('--pc',layoutAt(st.m)?'rgba(255,190,50,.6)':'rgba(90,169,255,.6)');p.classList.remove('go');void p.offsetWidth;p.classList.add('go')}
function bump(){const b=$('board');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}
function fxMove(sh){const pc=$('board').querySelector('.p');if(pc){const r=pc.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,sh?12:5,sh?['#7fd3ff','#ffd54a','#fff']:['#ffe27a','#fff'])}if(sh)pulse()}
for(let i=0;i<14;i++){const e=document.createElement('i');e.className='ff';e.style.cssText=`left:${Math.random()*100}vw;top:${Math.random()*100}vh;--fx:${(Math.random()-.5)*160}px;--fy:${(Math.random()-.5)*160}px;animation-delay:${-Math.random()*6}s;animation-duration:${4+Math.random()*4}s`;document.body.appendChild(e)}
// ---- sound + chiptune loop ----
let ac;const ctx=()=>ac=ac||new(window.AudioContext||window.webkitAudioContext)();
function blip(f,d=.07,type='square',vol=.05){try{const c=ctx(),o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.value=f;v.gain.value=vol;o.connect(v);v.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function jingle(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,.12),i*110))}
const MEL=[262,330,392,330,294,349,440,349,262,330,392,523,392,330,294,330];let mt=null,ms=0;
$('mu').onclick=()=>{if(mt){clearInterval(mt);mt=null;$('mu').textContent='Music: off'}else{mt=setInterval(()=>{blip(MEL[ms%16],.2,'square',.018);if(ms%4===0)blip(MEL[ms%16]/2,.5,'triangle',.04);ms++},330);$('mu').textContent='Music: on'}};
function key(k){k=k.toLowerCase();const d={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
  if(d)move(...d);else if(k===' ')move(0,0);else if(k==='z')undo();else if(k==='m'&&!open_())menu();else if(k==='r'&&!open_())load(li)}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();key(e.key)});
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>key(b.dataset.k));
load(0);let seen=false;try{seen=!!localStorage.getItem("shiftmaze_seen")}catch(e){}seen?menu():howto();
</script></body></html>
